name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @tanguito/browser-dev-mcp exec playwright install --with-deps chromium

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      # Root-level suite: not a workspace package, so `pnpm -r test` skips it.
      - name: Capability registry contract
        run: pnpm run contract:capabilities:verify

      - name: Pack dry-run
        run: pnpm -r pack:dry-run

  doctor:
    name: Doctor check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build everything rather than a hand-maintained filter. The filtered set
      # broke twice by omitting a newly added workspace dependency, and a
      # recursive build resolves the graph in topological order for a few extra
      # seconds. Correctness beats the saving.
      - name: Build
        run: pnpm -r build

      - name: Doctor (browser)
        run: pnpm --filter @tanguito/browser-dev-mcp run doctor

      - name: Doctor (gamemaker read)
        run: pnpm --filter @tanguito/gamemaker-dev-mcp run doctor

      - name: Doctor (gamemaker write)
        run: pnpm --filter @tanguito/gamemaker-write-mcp run doctor

      # Never starts Igor; CI has no GameMaker and the doctor reports that as a
      # warning rather than a failure.
      - name: Doctor (gamemaker build)
        run: pnpm --filter @tanguito/gamemaker-compile-mcp run doctor

      - name: Doctor (gamemaker asset)
        run: pnpm --filter @tanguito/gamemaker-asset-mcp run doctor

      # Never starts Aseprite; CI has none and the doctor reports that as a
      # warning rather than a failure.
      - name: Doctor (aseprite ingest)
        run: pnpm --filter @tanguito/aseprite-ingest-mcp run doctor
